name: Refresh living sky
on:
  workflow_dispatch:
  schedule:
    - cron: '21 6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate contribution-powered star field
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_sky.py
      - name: Commit updated sky if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/living-sky.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh living sky contribution constellation"
            git push
          fi
