04" y2="82"/><rect class="node" x="8" y="50" width="102" height="64" rx="14"/><rect class="node" x="166" y="50" width="86" height="64" rx="14"/><rect class="node" x="304" y="50" width="106" height="64" rx="14"/><text x="59" y="87" text-anchor="middle">Question</text><text x="209" y="87" text-anchor="middle">Build</text><text x="357" y="87" text-anchor="middle">Evaluate</text><text x="210" y="155" text-anchor="middle">↻ Learn, iterate, improve</text></svg><button class="btn alt" id="sticky" aria-expanded="false" aria-controls="sticky-note">✿ Peel back the sticky note</button><div class="note" id="sticky-note" hidden>Good research isn't only about an answer. It's about knowing how much to trust it.</div><span class="page-num">folio / 03</span>`,`<span class="small">page 04 / built with care</span><h2>Beyond the research desk.</h2><p>I also enjoy building practical software and interactive experiences.</p><a class="project" href="https://github.com/ShreeyaKamath/ManipalDMS"><strong>ManipalDMS ↗</strong><small>C# Windows Forms · SQL Server · Document management</small></a><a class="project" href="https://github.com/ShreeyaKamath/Interactive-Learning-Platform"><strong>Interactive Learning Platform ↗</strong><small>Educational software development</small></a><p style="margin-top:30px">Thanks for wandering through these pages. The experiments continue beyond this notebook.</p><div class="controls"><a class="btn" href="https://github.com/ShreeyaKamath">Visit my GitHub ↗</a><button class="btn alt" onclick="go(0)">Back to the beginning ↺</button></div><span class="page-num">folio / 04</span>`];let index=0;const content=document.getElementById('content');function go(i){const previous=index;index=Math.max(0,Math.min(pages.length-1,i));content.innerHTML=pages[index];content.classList.remove('turn-forward','turn-back');void content.offsetWidth;content.classList.add(index>=previous?'turn-forward':'turn-back');document.getElementById('prev').disabled=index===0;document.getElementBy
