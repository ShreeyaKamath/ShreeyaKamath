<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Constellation of ideas</title>
  <desc id="desc">Five named fields—AI, generative systems, responsible AI, agents, and software—connected as a quiet constellation above a moonlit horizon.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#091426"/>
      <stop offset=".72" stop-color="#142b43"/>
      <stop offset="1" stop-color="#20374d"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" x2="1">
      <stop stop-color="#7590a5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d5c7c4" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7590a5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#f0e5d4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f0e5d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1000" height="300" rx="22" fill="url(#sky)"/>
  <ellipse cx="500" cy="268" rx="390" ry="30" fill="url(#halo)" filter="url(#soft)"/>
  <path d="M42 262C220 250 325 274 500 260s299 10 458 0" fill="none" stroke="url(#horizon)" stroke-width="1.4">
    <animate attributeName="d" dur="20s" repeatCount="indefinite" values="M42 262C220 250 325 274 500 260s299 10 458 0;M42 260C220 274 325 250 500 263s299-8 458-1;M42 262C220 250 325 274 500 260s299 10 458 0"/>
  </path>

  <g fill="none" stroke="#8eabba" stroke-width="1.25" opacity=".5">
    <path d="M120 155L286 82L484 145L690 70L875 148"/>
    <path d="M286 82L390 218L484 145L625 220L690 70"/>
    <path d="M484 145L875 148" opacity=".45"/>
  </g>

  <g fill="none" stroke="#d6bdc6" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M120 155L286 82L484 145L690 70L875 148" stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" values="900;0;0" keyTimes="0;.55;1" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#f2e9db">
    <circle cx="120" cy="155" r="5"><animate attributeName="r" values="4.5;5.8;4.5" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="286" cy="82" r="4"><animate attributeName="opacity" values=".65;1;.65" begin="-1.3s" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="484" cy="145" r="6"><animate attributeName="r" values="5.2;6.5;5.2" begin="-2.4s" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="70" r="4.5"><animate attributeName="opacity" values=".6;1;.6" begin="-3.5s" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="875" cy="148" r="5"><animate attributeName="r" values="4.4;5.6;4.4" begin="-4.2s" dur="9.5s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="218" r="3.5" opacity=".75"/>
    <circle cx="625" cy="220" r="3.5" opacity=".75"/>
  </g>

  <g fill="#dce7ea" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.2">
    <text x="120" y="183" text-anchor="middle">AI + ML</text>
    <text x="286" y="58" text-anchor="middle">GENERATIVE AI</text>
    <text x="484" y="174" text-anchor="middle">RESPONSIBLE AI</text>
    <text x="690" y="46" text-anchor="middle">AGENT SYSTEMS</text>
    <text x="875" y="177" text-anchor="middle">SOFTWARE</text>
  </g>

  <g fill="#a9c0cc">
    <circle cx="65" cy="55" r="1.2" opacity=".55"/><circle cx="178" cy="38" r="1" opacity=".7"/>
    <circle cx="410" cy="38" r="1.3" opacity=".5"/><circle cx="560" cy="73" r="1" opacity=".65"/>
    <circle cx="805" cy="42" r="1.2" opacity=".55"/><circle cx="936" cy="82" r="1" opacity=".7"/>
    <circle cx="782" cy="226" r="1.2" opacity=".45"/><circle cx="220" cy="226" r="1" opacity=".5"/>
  </g>
</svg>
