<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="The Sky That Remembers: animated pastel clouds, moon, shooting stars and a contribution-powered constellation">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101631"/><stop offset=".52" stop-color="#423d79"/><stop offset="1" stop-color="#c78bb3"/></linearGradient><radialGradient id="moon"><stop stop-color="#fffce8"/><stop offset=".65" stop-color="#f7d9ed"/><stop offset="1" stop-color="#d8a9ef"/></radialGradient><linearGradient id="cloud"><stop stop-color="#f9e9ff" stop-opacity=".92"/><stop offset="1" stop-color="#e9c9e9" stop-opacity=".5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><clipPath id="clip"><rect width="1100" height="440" rx="22"/></clipPath></defs>
