<g stroke="#fff9ed" stroke-width="3" stroke-linecap="round" opacity="0"><path d="M1100 0L1030 70"/><animateTransform attributeName="transform" type="translate" values="0 0;-900 350" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.55;.6;.68;1" dur="12s" repeatCount="indefinite"/></g>
<text x="80" y="127" fill="#fff8ff" font-family="Georgia,serif" font-size="59">Shreeya Kamath</text><text x="83" y="171" fill="#e5e1fc" font-family="sans-serif" font-size="19" letter-spacing="4">THE SKY THAT REMEMBERS</text><text x="83" y="215" fill="#fce9fa" font-family="Georgia,serif" font-style="italic" font-size="22">where curiosity becomes constellations</text><text x="83" y="269" fill="#e7dafa" font-family="sans-serif" font-size="16">AI · Responsible ML · Agentic Systems · Software Engineering</text>
