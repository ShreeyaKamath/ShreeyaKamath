<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="54" viewBox="0 0 1000 54" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit celestial divider</title>
  <desc id="desc">A restrained silver-blue wave crossed by a small five-star constellation.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none }
    }
  </style>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#7790a5" stop-opacity="0"/>
      <stop offset=".2" stop-color="#7790a5" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#c2b2bc" stop-opacity=".62"/>
      <stop offset=".8" stop-color="#7790a5" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7790a5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M18 30C175 18 286 40 438 29s275-4 544 0" fill="none" stroke="url(#line)" stroke-width="1.3">
    <animate attributeName="d" dur="18s" repeatCount="indefinite" values="M18 30C175 18 286 40 438 29s275-4 544 0;M18 29C175 40 286 18 438 30s275 3 544-1;M18 30C175 18 286 40 438 29s275-4 544 0"/>
  </path>
