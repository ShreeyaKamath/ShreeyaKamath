<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="54" viewBox="0 0 1000 54" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit celestial divider</title>
  <desc id="desc">A delicate silver-blue horizon wave passing beneath a small five-star constellation.</desc>
  <style>@media (prefers-reduced-motion:reduce){animate,animateMotion,.motion-layer{display:none}}</style>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#7790a5" stop-opacity="0"/>
      <stop offset=".22" stop-color="#7790a5" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#c6b8c1" stop-opacity=".54"/>
      <stop offset=".78" stop-color="#7790a5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7790a5" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <path d="M18 31C175 21 286 39 438 29s275-3 544 0" fill="none" stroke="url(#line)" stroke-width="1"/>
  <path class="motion-layer" d="M18 31C175 21 286 39 438 29s275-3 544 0" fill="none" stroke="url(#line)" stroke-width=".9" opacity=".4">
    <animate attributeName="d" dur="22s" repeatCount="indefinite" values="M18 31C175 21 286 39 438 29s275-3 544 0;M18 29C175 37 286 22 438 31s275 2 544-1;M18 31C175 21 286 39 438 29s275-3 544 0"/>
  </path>

  <path d="M444 26L476 15L510 28L541 13L574 25" fill="none" stroke="#93aabd" stroke-width=".85" opacity=".42"/>
  <path class="motion-layer" d="M444 26L476 15L510 28L541 13L574 25" fill="none" stroke="#d2bec8" stroke-width="1" stroke-dasharray="34 116" stroke-dashoffset="150" opacity=".62">
    <animate attributeName="stroke-dashoffset" values="150;-150" dur="17.5s" repeatCount="indefinite"/>
  </path>

  <g fill="#e6ddd7"><circle cx="444" cy="26" r="1.8"/><circle cx="476" cy="15" r="1.6"/><circle cx="510" cy="28" r="2"/><circle cx="541" cy="13" r="1.5"/><circle cx="574" cy="25" r="1.8"/></g>
  <g class="motion-layer" fill="#f4edf0" filter="url(#softGlow)" opacity="0">
    <circle cx="476" cy="15" r="3"><animate attributeName="opacity" values="0;0;.52;0;0" keyTimes="0;.28;.34;.43;1" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="541" cy="13" r="2.8"><animate attributeName="opacity" values="0;0;.46;0;0" keyTimes="0;.58;.64;.72;1" dur="16s" repeatCount="indefinite"/></circle>
  </g>
  <circle class="motion-layer" r="1.7" fill="#f2e9e5" opacity="0">
    <animateMotion path="M18 31C175 21 286 39 438 29S713 26 982 29" dur="23s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;.55;.55;0;0" keyTimes="0;.18;.23;.42;.48;1" dur="23s" repeatCount="indefinite"/>
  </circle>
</svg>
