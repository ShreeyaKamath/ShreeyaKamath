    <path d="M444 26L476 15L510 28L541 13L574 25" stroke-dasharray="150" stroke-dashoffset="150">
      <animate attributeName="stroke-dashoffset" values="150;0;0" keyTimes="0;.4;1" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#e6ddd7">
    <circle cx="444" cy="26" r="2.2"><animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="476" cy="15" r="1.8"><animate attributeName="opacity" values=".5;.95;.5" begin="-1.2s" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="28" r="2.4"><animate attributeName="opacity" values=".6;1;.6" begin="-2.4s" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="541" cy="13" r="1.7"><animate attributeName="opacity" values=".45;.9;.45" begin="-3.1s" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="574" cy="25" r="2.1"><animate attributeName="opacity" values=".55;1;.55" begin="-4.4s" dur="9.5s" repeatCount="indefinite"/></circle>
